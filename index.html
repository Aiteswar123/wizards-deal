<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wizard's Deal</title>
<meta name="description" content="Play the Harry Potter edition of Monopoly Deal online with 2 to 12 friends, each on their own device.">
<meta name="theme-color" content="#0b0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Grenze+Gotisch:wght@500;700;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Quidditch matchday in house colours: a bulb-lit scoreboard races everyone to three sets, the shared table is a floodlit pitch,
   your hand sits at the thumb. Each player's screen takes the colours of their character's Hogwarts house (data-house on <html>);
   before the sorting it is the Great Hall at night. --live is reserved for the live move: your turn and the active turn light. */
@property --stand{syntax:"<color>";inherits:true;initial-value:#17132b}
@property --stand-2{syntax:"<color>";inherits:true;initial-value:#201a3a}
@property --line{syntax:"<color>";inherits:true;initial-value:#352c5c}
@property --board{syntax:"<color>";inherits:true;initial-value:#0b0916}
@property --board-2{syntax:"<color>";inherits:true;initial-value:#151127}
@property --live{syntax:"<color>";inherits:true;initial-value:#ffb23e}
@property --crest{syntax:"<color>";inherits:true;initial-value:#d8b25a}
:root{
  --stand:#17132b; --stand-2:#201a3a; --stand-3:#2a234b; --line:#352c5c; --line-2:#463b76;
  --board:#0b0916; --board-2:#151127; --bulb-off:#262041;
  --live:#ffb23e; --live-ink:#2a1700; --crest:#d8b25a;
  --muted:#b5acd6; --dim:#8d84b6;
  --pitch:#2e7d46; --pitch-2:#286e3d; --chalk:#f4f1e8; --chalk-2:rgba(244,241,232,.62);
  --ink:#f4f1e8; --ink-2:color-mix(in srgb,var(--chalk) 82%,var(--muted));
  --galleon:#e2b23a; --galleon-ink:#2b1d00; --felt:#1f4f39;
  --magic:"Grenze Gotisch","Big Shoulders Display",serif;
  transition:--stand .9s ease,--stand-2 .9s ease,--line .9s ease,--board .9s ease,--board-2 .9s ease,--live .9s ease,--crest .9s ease;
  --card:#f6f3ea; --card-ink:#141a27; --card-muted:#59607a;
  --spell:#8e6ad8; --spell-face:#efe9fb; --ok:#6fd49a; --warn:#ff9f5e; --bad:#ff6b6b;
  --display:"Big Shoulders Display","Barlow Condensed",sans-serif;
  --label:"Barlow Condensed","Barlow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
/* Gryffindor: scarlet and gold */
:root[data-house=gryffindor]{--stand:#3d0a12;--stand-2:#520e19;--stand-3:#6a1422;--line:#7e1b2a;--line-2:#9b2636;--board:#22050a;--board-2:#330810;--bulb-off:#4a1820;
  --live:#ffc94a;--live-ink:#2b1a00;--crest:#f0c040;--muted:#f0c4c0;--dim:#d29d98;--band:#a3121c;--band-ink:#f6cf55;--felt:#7a1019}
/* Slytherin: green and silver */
:root[data-house=slytherin]{--stand:#04301f;--stand-2:#08402a;--stand-3:#0d5236;--line:#126444;--line-2:#1a7d55;--board:#011c12;--board-2:#04281a;--bulb-off:#0f3d2b;
  --live:#6ff0ad;--live-ink:#02200f;--crest:#d3d9df;--muted:#b3dccb;--dim:#8cbfaa;--band:#1a5c37;--band-ink:#e2e7ec;--felt:#0f5636}
/* Ravenclaw: blue and bronze */
:root[data-house=ravenclaw]{--stand:#0b2266;--stand-2:#102d80;--stand-3:#163a99;--line:#1d47b0;--line-2:#2a5bd0;--board:#061545;--board-2:#0b1f5c;--bulb-off:#1a2f70;
  --live:#ffab6b;--live-ink:#2a1300;--crest:#d9944f;--muted:#c3d0f5;--dim:#9fb2e6;--band:#1f3f9e;--band-ink:#eaa866;--felt:#1b3f96}
/* Hufflepuff: yellow and black */
:root[data-house=hufflepuff]{--stand:#1f1a08;--stand-2:#2c250b;--stand-3:#3a300e;--line:#4a3d12;--line-2:#66541a;--board:#110e03;--board-2:#1c1806;--bulb-off:#3a3212;
  --live:#ffd43f;--live-ink:#221900;--crest:#f2c230;--muted:#e4d6a2;--dim:#bfae74;--band:#ecb939;--band-ink:#1a1400;--felt:#5a4610}
*{box-sizing:border-box}
::selection{background:var(--chalk);color:var(--board)}
html{scrollbar-color:var(--line-2) var(--stand);accent-color:var(--chalk);-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--stand)}
input,select{caret-color:var(--live)}
html,body{min-height:100%}
body{margin:0;background:var(--stand);color:var(--ink);font:400 1rem/1.5 var(--body);padding-inline:16px;
  padding-block:env(safe-area-inset-top,0px) calc(56px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse 70rem 30rem at 50% -10rem,color-mix(in srgb,var(--crest) 22%,transparent),transparent 70%),linear-gradient(180deg,var(--board) 0,var(--stand) 30rem)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
a{color:var(--chalk);text-underline-offset:3px}
.wrap{max-width:84rem;margin:0 auto}
.muted{color:var(--muted)}
.num,.stats,.coin,.bigcode,.back,.chip .v,.card .val,.charge{font-variant-numeric:tabular-nums}
.grow{flex:1}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.lbl{font:700 .78rem/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;border:1px solid var(--line-2);background:var(--stand-3);border-radius:4px;
  padding:.55rem 1.1rem;font:700 1rem/1 var(--label);letter-spacing:.07em;text-transform:uppercase;transition:background-color .15s,border-color .15s,transform .15s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--chalk);background:var(--line)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--chalk);color:var(--board);border-color:var(--chalk)}
.btn.primary:hover:not(:disabled){background:#fff}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{min-height:2.25rem;padding:.4rem .75rem;font-size:.85rem}
input[type=text],select{background:var(--board-2);border:1px solid var(--line-2);border-radius:4px;padding:.65rem .8rem;min-width:0;min-height:2.75rem;transition:border-color .15s}
input[type=text]:hover,select:hover{border-color:var(--dim)}
input[type=text]:focus{border-color:var(--chalk);outline:none}
input::placeholder{color:var(--dim);opacity:1}

/* Bulb numerals: digits built cell by cell from a 3x5 bulb grid */
.bulbs{--b:8px;--g:3px;display:inline-grid;grid-template-columns:repeat(3,var(--b));gap:var(--g);vertical-align:middle}
.bulbs i{width:var(--b);height:var(--b);border-radius:50%;background:var(--bulb-off)}
.bulbs i.on{background:radial-gradient(circle at 38% 34%,#fff 0 18%,var(--lit,var(--chalk)) 60%);box-shadow:0 0 6px color-mix(in srgb,var(--lit,var(--chalk)) 55%,transparent)}
.bulbs.big{--b:13px;--g:4px}
@keyframes bulb{from{opacity:.1;transform:scale(.4)}to{opacity:1;transform:none}}

/* Home */
.mast{padding-block:2.5rem 1.75rem;display:grid;gap:1.5rem;align-items:end}
.mast{position:relative;padding-top:5rem}
.mast h1{font:700 clamp(3.6rem,16vw,6rem)/.85 var(--magic);letter-spacing:0}
.mast h1 span{display:block;color:var(--crest);padding-left:.35em}
.mast p{max-width:58ch;color:var(--muted);font-size:1.1rem;margin-top:1rem}
.race{display:flex;align-items:center;gap:1rem;background:var(--board);padding:1rem 1.25rem;border-radius:6px;box-shadow:0 18px 30px -18px rgba(0,0,0,.8);justify-self:start}
.race p{margin:0;font:700 1rem/1.15 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);max-width:11ch}
.race{margin-top:1.5rem}
@media (min-width:860px){.mast{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.fanwrap{display:grid;place-items:center;height:17rem;padding-inline:3rem 4rem;animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-10px)}}
.fan{position:relative;width:8rem;height:12.4rem;transform:perspective(1000px) rotateX(var(--rx,6deg)) rotateY(var(--ry,-10deg));transition:transform .6s var(--ease);transform-style:preserve-3d}
.fan.tilting{transition:transform .12s linear}
.fan .card{position:absolute;inset:0;transform-origin:50% 120%}
.fan .card:nth-child(1){transform:rotate(-15deg) translate(-1.4rem,.7rem)}
.fan .card:nth-child(2){transform:translateY(-.7rem);z-index:1}
.fan .card:nth-child(3){transform:rotate(15deg) translate(1.4rem,.7rem)}
.fan .card::before{opacity:.95}
@media (max-width:859px){.fanwrap{height:15.5rem;justify-self:center}.fan{transform:perspective(1000px) rotateX(var(--rx,6deg)) rotateY(var(--ry,-10deg)) scale(.9)}}
.home-grid{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.kit{background:var(--stand-2);border:1px solid var(--line);border-radius:8px;padding:1.4rem;display:flex;flex-direction:column;gap:1.4rem;min-width:0}
.kit h2,.fixtures h2,.lobby h2{font:700 1.9rem/1 var(--magic)}
.field{display:flex;flex-direction:column;gap:.55rem}
.field p{font-size:.92rem;color:var(--muted)}
#myname{width:100%;max-width:22rem;font-size:1.1rem}
#joincode{width:7.5rem;text-transform:uppercase;letter-spacing:.24em;font:800 1.2rem/1 var(--display)}
.joinrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.divider{display:flex;align-items:center;gap:.75rem;color:var(--dim);font:600 .8rem/1 var(--label);letter-spacing:.14em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.fixtures{background:var(--board);border-radius:8px;padding:1.4rem;display:flex;flex-direction:column;gap:1rem;min-width:0;box-shadow:0 18px 30px -18px rgba(0,0,0,.8)}
.fixtures header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.fixlist{display:flex;flex-direction:column}
.fixlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.9rem;padding:.75rem 0;border-top:1px solid var(--board-2)}
.fixlist .code{font:800 1.7rem/1 var(--display);letter-spacing:.14em}
.fixlist .host{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:.3rem}
.pips i{width:.6rem;height:.6rem;border-radius:50%;background:var(--bulb-off)}
.pips i.on{background:var(--chalk)}
.nofix{color:var(--muted);padding:1.25rem 0;border-top:1px solid var(--board-2)}
.code-chip{font-weight:800;letter-spacing:.16em;font-family:var(--display)}
.fine{font-size:.82rem;color:var(--dim);margin-top:1.75rem;max-width:70ch}

/* How to play */
.ref{margin-top:1.5rem;background:var(--stand-2);border:1px solid var(--line);border-radius:8px;padding:0 1.25rem}
.ref summary{cursor:pointer;padding:1.05rem 0;font:700 1.6rem/1 var(--magic);list-style:none;display:flex;align-items:center;justify-content:space-between}
.ref summary::-webkit-details-marker{display:none}
.ref summary::after{content:"";width:.6rem;height:.6rem;border-right:2px solid var(--chalk);border-bottom:2px solid var(--chalk);transform:rotate(45deg) translateY(-3px);transition:transform .2s var(--ease)}
.ref[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
.ref .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1.5rem;padding-bottom:1.4rem}
.ref h3{font:700 1rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .6rem;color:var(--chalk)}
.ref li{font-size:.94rem;margin-bottom:.4rem;color:var(--ink-2)}
.ref li b{color:var(--chalk)}

/* Lobby */
.lobby{max-width:42rem;margin:2.5rem auto 0;display:flex;flex-direction:column;gap:1.5rem}
.codeboard{background:var(--board);border-radius:8px;padding:1.1rem 1.25rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem;box-shadow:0 18px 30px -18px rgba(0,0,0,.8)}
.codeboard .lbl{color:var(--muted)}
.bigcode{font:900 clamp(3.4rem,17vw,5.6rem)/.9 var(--display);letter-spacing:.16em;margin-right:auto}
.lobby .hint{color:var(--muted);margin-top:-.5rem}
.seats{display:flex;flex-direction:column;gap:.45rem;margin-top:.75rem}
.seats li{display:flex;align-items:center;gap:.9rem;background:var(--stand-2);border:1px solid var(--line);border-radius:6px;padding:.65rem .85rem;min-height:3.4rem}
.seats li.open{border-style:dashed;background:transparent;color:var(--dim)}
.seats .no{font:900 1.6rem/1 var(--display);width:1.4rem;text-align:center;color:var(--dim)}
.seats li:not(.open) .no{color:var(--chalk)}
.seats .tag{margin-left:auto;font:700 .78rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.namefield{display:flex;flex-direction:column;gap:.45rem}
.namefield input{max-width:22rem}

/* Scoreboard */
.board{background:var(--board);margin-inline:-16px;padding:.7rem 16px .85rem;box-shadow:0 18px 30px -20px rgba(0,0,0,.9);position:relative}
.board-top{display:flex;align-items:center;gap:.5rem .9rem;flex-wrap:wrap}
.mark{font:700 1.6rem/1 var(--magic);color:var(--crest)}
.tcode{font:600 .85rem/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcode b{color:var(--chalk);font-family:var(--display);font-size:1.05rem;letter-spacing:.16em;margin-left:.2rem}
.frozen{color:var(--warn)}
.ticker{display:flex;gap:.6rem;align-items:baseline;margin-top:.55rem;background:var(--board-2);border-radius:4px;padding:.45rem .65rem;font-size:.9rem;color:var(--ink-2);min-width:0}
.ticker .tl{flex:none;font:700 .72rem/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticker b{color:var(--chalk)}
@media (max-width:480px){.mark{font-size:1.25rem}.tcode{font-size:.75rem}.board-top .btn.small{padding:.35rem .55rem;font-size:.78rem}}
.conn{font:600 .85rem/1 var(--label);letter-spacing:.06em;color:var(--warn)}

/* Arena */
.arena{display:grid;gap:1.1rem;margin-top:.6rem;grid-template-columns:minmax(0,1fr);grid-template-areas:"pitch" "zone" "me";align-items:start}
@media (min-width:1000px){.zone{grid-template-columns:minmax(17rem,21rem) minmax(0,1fr);align-items:start}}

/* The table takes the shape of the players around it: two at a long table, three at a triangle, four at a square,
   five at a pentagon. Each player sits at the middle of their own side, you on the bottom edge, and the cards they
   have played lie along their edge. The shape is drawn as SVG (tableSVG): oak with real grain, brass studs, a gold
   inlay and the house cloth. Wide and narrow screens each get their own geometry (tableGeom). */
.table{grid-area:pitch;position:relative;justify-self:center;width:min(44rem,100% - 9rem);aspect-ratio:1;margin:3.4rem 0 4.4rem}
.table.n2{aspect-ratio:100/80}
.table.n3{width:min(52rem,100% - 9rem)}
/* six or more at the table: a bigger table, compact seats and compact card stacks */
.table.many{width:min(58rem,100% - 9rem)}
.table.many .plate{grid-template-columns:auto;grid-template-areas:"sh" "pl" "pm";justify-items:center;text-align:center;padding:.35rem .45rem .4rem;max-width:7rem;row-gap:.15rem}
.table.many .plate small{display:none}
.table.many .plate .shield{width:1.45rem;height:1.67rem}
.table.many .plate b{font-size:.8rem;max-width:6.2rem}
.table.many .plate .pm{gap:.32rem;font-size:.74rem}
.table.many .played:not(.mine) .mini{width:1.05rem;height:1.45rem;border-width:1px}
.table.many .played:not(.mine) .mini+.mini{margin-left:-.75rem}
.table.many .played:not(.mine) .mini svg{display:none}
.table.many .played:not(.mine) .stack small{font-size:.6rem}
.table.many .played:not(.mine){gap:.25rem .35rem}
.seatcount{display:block;margin-top:.25rem;font:600 .78rem/1 var(--label);letter-spacing:.06em;color:var(--dim)}
.tsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 26px 28px rgba(0,0,0,.72))}
.tsvg.nw{display:none}
.glintbar{opacity:0}
.table.flash .glintbar{opacity:1;animation:glintmove 1.3s var(--ease) both}
@keyframes glintmove{from{transform:translateX(0)}to{transform:translateX(200px)}}
.center{position:absolute;left:var(--cx,50%);top:var(--cy,50%);transform:translate(-50%,-50%);z-index:2;width:var(--cw,34%);display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;color:var(--chalk)}
.center .say{font:700 clamp(1.6rem,2.8vw,2.4rem)/.95 var(--magic);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.table.flash .say{animation:sayin .7s var(--ease)}
@keyframes sayin{from{opacity:0;transform:translateY(6px) scale(1.08);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.plate{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:4;display:grid;grid-template-columns:auto auto;grid-template-areas:"sh pl" "sh pm";
  align-items:center;column-gap:.55rem;row-gap:.25rem;padding:.5rem .85rem .5rem .55rem;border-radius:12px;background:var(--board);max-width:14rem;
  box-shadow:0 14px 24px -10px rgba(0,0,0,.9),inset 0 0 0 1px color-mix(in srgb,var(--c) 65%,transparent),inset 0 3px 0 var(--c)}
.plate .shield{grid-area:sh;width:1.8rem;height:2.07rem}
.plate .pl{grid-area:pl;min-width:0}
.plate b{display:block;font:700 .95rem/1.05 var(--label);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:8.5rem}
.plate small{display:block;font:500 .76rem/1.15 var(--label);color:var(--muted);white-space:nowrap}
.plate .pm{grid-area:pm;display:flex;align-items:center;gap:.5rem;font:800 .85rem/1 var(--display);color:var(--chalk)}
.setpips{display:inline-flex;gap:3px}
.setpips i{width:.55rem;height:.55rem;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chalk) 45%,transparent)}
.setpips i.on{background:radial-gradient(circle at 38% 34%,#fff 0 18%,var(--lit,var(--chalk)) 60%);box-shadow:0 0 5px color-mix(in srgb,var(--lit,var(--chalk)) 55%,transparent)}
.plate .hc,.plate .bk{display:inline-flex;align-items:center;gap:.22rem}
.plate .hc i{width:.45rem;height:.66rem;border-radius:1px;background:var(--chalk);opacity:.85}
.plate .bk::before{content:"";width:.62rem;height:.62rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeaa6,var(--galleon) 55%,#a87a14)}
.plate em{position:absolute;left:50%;top:100%;transform:translate(-50%,-35%);white-space:nowrap;font:700 .66rem/1 var(--label);font-style:normal;letter-spacing:.12em;text-transform:uppercase;padding:.25rem .5rem;border-radius:999px;background:var(--board)}
.tclock{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:7rem;margin-bottom:.15rem}
.tclock .tlabel{font:700 .66rem/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk);opacity:.85}
.tclock b{font:800 1.6rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--chalk);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tclock .tbar{display:block;width:100%;height:4px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
.tclock .tbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(var(--p,1));background:var(--live);transition:transform .25s linear}
.tclock.resp b{color:var(--warn)}
.tclock.resp .tbar i{background:var(--warn)}
.tclock.low b,.plate em.low span{color:var(--bad);animation:urgent 1s steps(2) infinite}
@keyframes urgent{50%{opacity:.45}}
.peek{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 0}
.peek .card{width:6.4rem;min-height:9.6rem}
.answerclock{font:600 .9rem/1.3 var(--label);letter-spacing:.03em;color:var(--warn)}
.answerclock b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.plate .turnlight{color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}

  display:flex;flex-direction:column;gap:.26rem;overflow:hidden;box-shadow:0 10px 18px -10px rgba(0,0,0,.8);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift));transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s var(--ease);mix-blend-mode:soft-light;

button.card:hover,.card.tilting{--lift:-6px;box-shadow:0 18px 26px -12px rgba(0,0,0,.9)}

.card .cs{font:700 .66rem/1.1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--card-muted)}
.card .cb{font-size:.75rem;line-height:1.3}
.card .rent{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.card .rent span{font:700 .68rem/1 var(--label);background:var(--card-ink);color:var(--card);border-radius:2px;padding:.2rem .28rem;font-variant-numeric:tabular-nums}
.card.t-spell{--face:var(--spell-face)}
.card.t-point{--face:var(--board);color:var(--chalk)}
.card.t-point .cn{font:900 1.8rem/.95 var(--display);padding-right:0;margin-top:.3rem;color:var(--galleon)}
.card.t-point .cs{color:var(--muted)}
.card.t-point .val{background:var(--galleon);color:var(--galleon-ink)}
.card.small{width:4.2rem;min-height:5.8rem;padding:1.05rem .3rem .3rem;font-size:.6rem;box-shadow:0 8px 14px -8px rgba(0,0,0,.7)}
.card.small .cn{font-size:.72rem;padding-right:0}
.card.t-point.small .cn{font-size:1rem;margin-top:.2rem}
.card.small .val{top:auto;bottom:.25rem;right:.25rem;width:1.15rem;height:1.15rem;font-size:.66rem}
.card.small .cb,.card.small .cs,.card.small .rent,.card.small .art{display:none}
.card.small{border-width:1.5px}
.card.small .band{height:.65rem}
@media (max-width:640px){.card{width:7.4rem;min-height:11.8rem}.card .cn{font-size:1rem}.card .art{height:2.3rem}}

/* Table talk, winner, toast */
.log{margin-top:1.5rem;background:var(--stand-2);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem}
.log ol{margin-top:.7rem;display:flex;flex-direction:column-reverse;gap:.3rem;font-size:.92rem;color:var(--muted);max-height:13rem;overflow:auto}
.log li{padding-left:.75rem;position:relative}
.log li::before{content:"";position:absolute;left:0;top:.6em;width:.3rem;height:.3rem;border-radius:50%;background:var(--line-2)}
.log b{color:var(--ink);font-weight:600}
.log .stamp{font-size:.66rem;padding:.12rem .3rem;margin-left:.4rem;transform:rotate(-3deg);vertical-align:.1em}
.log .stamp.win{color:var(--ok)}
.winner{text-align:center;padding:2rem 1rem 1.6rem;display:flex;flex-direction:column;gap:.9rem;align-items:center;background:var(--board);border-radius:8px;margin-top:1rem;box-shadow:0 18px 30px -18px rgba(0,0,0,.9)}
.winner .lbl{color:var(--muted)}
.winner h2{font:700 clamp(3rem,11vw,5rem)/.9 var(--magic);color:var(--crest)}
.winner.you h2{color:var(--live)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--board);color:var(--chalk);font-weight:600;padding:.8rem 1.1rem .8rem 1rem;border-radius:6px;
  max-width:calc(100% - 32px);z-index:30;border:1px solid var(--bad);box-shadow:0 14px 28px -10px rgba(0,0,0,.9);animation:toastin .35s var(--ease)}
.toast.good{border-color:var(--ok)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Spell cut-in: replayed on the big screen */
.ci{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,9,16,0);transition:background .25s;cursor:pointer;overflow:hidden}
.ci[hidden]{display:none}
.ci.on{background:rgba(6,9,16,.66)}
.ci.out{background:rgba(6,9,16,0)}
.ci-band{position:relative;width:100%;height:min(46vh,24rem);clip-path:polygon(0 18%,100% 0,100% 82%,0 100%);transform:translateX(-105%);background:var(--board);overflow:hidden}
.ci.on .ci-band{animation:ci-in .34s var(--ease) forwards}
.ci.out .ci-band{animation:ci-out .36s cubic-bezier(.7,0,.84,0) forwards}
@keyframes ci-in{from{transform:translateX(-105%) skewX(-10deg)}to{transform:none}}
@keyframes ci-out{from{transform:none}to{transform:translateX(105%) skewX(-10deg)}}
.ci-burst{position:absolute;inset:0;background:radial-gradient(ellipse 60% 90% at 26% 55%,rgba(255,255,255,.5) 0%,var(--ci) 20%,color-mix(in srgb,var(--ci) 38%,#0b0f17) 50%,#0b0f17 82%)}
.ci-burst::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.12) 1.5px,transparent 2px) 0 0/14px 14px;mask:linear-gradient(90deg,transparent 35%,#000 75%)}
.ci-streaks i{position:absolute;left:-60%;width:55%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ci2),transparent);animation:ci-streak .6s linear 3 both}
@keyframes ci-streak{from{transform:translateX(0)}to{transform:translateX(330%)}}
.ci-art{position:absolute;left:6%;bottom:-34%;height:128%;aspect-ratio:270/320;animation:ci-art 1.7s var(--ease) both}
@keyframes ci-art{from{transform:translateX(-16%) scale(1.12)}to{transform:translateX(0) scale(1)}}
.ci-fig{width:100%;height:100%;filter:drop-shadow(0 14px 20px rgba(0,0,0,.65))}
.ci-spark{transform-box:fill-box;transform-origin:center;animation:ci-pulse .45s ease-in-out 4 alternate}
@keyframes ci-pulse{from{transform:scale(.75)}to{transform:scale(1.3)}}
.ci-text{position:absolute;right:5%;top:50%;transform:translateY(-50%) skewX(-8deg);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;max-width:58%}
.ci-who{font:700 .9rem/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ci-call{font:700 clamp(2.8rem,9vw,6rem)/.88 var(--magic);color:#fff;text-wrap:balance;text-shadow:0 0 24px var(--ci2),0 6px 14px rgba(0,0,0,.55);animation:ci-slam .5s var(--ease) .12s both}
@keyframes ci-slam{from{transform:scale(1.6);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.ci-char{font:700 .85rem/1 var(--label);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:color-mix(in srgb,var(--ci) 70%,#0b0f17);padding:.4rem .65rem;border-radius:3px}
.ci-band.ci-tall{height:min(70vh,34rem);clip-path:polygon(0 9%,100% 0,100% 91%,0 100%)}
.ci.reveal{background:rgba(6,9,16,.8)}
.ci-power{font-size:1.05rem;line-height:1.4;color:#fff;max-width:28rem;transform:skewX(8deg);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ci-others{font-size:.88rem;color:#e6e9f3;max-width:28rem;transform:skewX(8deg)}
.ci-go{appearance:none;margin-top:.7rem;transform:skewX(8deg);background:var(--chalk);color:var(--board);border:0;border-radius:4px;padding:.85rem 1.5rem;font:700 1.05rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 20px -10px rgba(0,0,0,.8)}
.ci-go:hover{background:#fff}
@media (max-width:640px){.ci-band.ci-tall{height:min(78vh,36rem)}.ci-tall .ci-art{opacity:.5}.ci-tall .ci-text{max-width:88%}}
@media (max-width:640px){.ci-band{height:min(40vh,18rem)}.ci-art{left:-6%}.ci-text{max-width:66%;right:4%}}
@media (prefers-reduced-motion:reduce){.ci .ci-band{transform:none}.ci-streaks{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="engine.js"></script>
<script src="cutin.js"></script>
<script src="sky.js"></script>
<script>
"use strict";
const E = window.Engine;
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const CHAR_KEYS = Object.keys(E.CHARS);

// This device's seat identity. "?as=name" gives a separate identity, handy for testing several players in one browser.
const AS = new URLSearchParams(location.search).get("as");
const ID_KEY = "wd-id" + (AS ? "-" + AS.replace(/[^a-z0-9]/gi, "") : "");
const ID = (() => { let id = LS.get(ID_KEY); if (!id || !id.pid || !id.token) { id = { pid: rnd(16), token: rnd(24) }; LS.set(ID_KEY, id); } return id; })();
const me = ID.pid;

let view = "home";   // home | game
let S = null;        // the table as this player may see it
let code = null;
let lobbies = [];
let netDown = false;
let clockOffset = 0;   // server time minus this device's time, so countdowns agree across devices
let ui = freshUI();
// The players' cards side panel: open by default on wide screens, remembered per device once toggled.
const sideOpen = () => { const s = LS.get("wd-side"); return s == null ? !!(window.matchMedia && matchMedia("(min-width:1000px)").matches) : !!s; };
function setSide(open) {
  LS.set("wd-side", open);
  const a = document.querySelector(".arena"); if (a) a.classList.toggle("side-open", open);
  document.querySelectorAll(".sidebtn").forEach(b => b.setAttribute("aria-expanded", String(open)));
}
function freshUI() { return { sel: null, step: {}, mode: null, picks: [], pay: [], keep: [], payKey: "", seat: -2 }; }

// ---------- server ----------
async function call(op, extra = {}) {
  try {
    const r = await fetch("/api/game", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ op, pid: ID.pid, token: ID.token, code }, extra)) });
    const j = await r.json();
    if (j.now) clockOffset = j.now - Date.now();
    if (j.error) { flash(j.error); return null; }
    netDown = false;
    if (j.game) { S = j.game; code = S.code; view = "game"; LS.set("wd-last", code); render(); gotState(); }
    return j;
  } catch (e) { flash("Couldn't reach the game server. Check your connection."); return null; }
}
let busy = false;
function setBusy(on) { busy = on; document.querySelectorAll(".panel,.hand").forEach(el => el.setAttribute("aria-busy", on ? "true" : "false")); }
async function act(action) {
  if (busy) return;
  const keepSeat = ui.seat;
  setBusy(true);
  const ok = await call("act", { action });
  setBusy(false);
  if (ok) { ui = freshUI(); ui.seat = keepSeat; render(); }
}
let pollGen = 0;
async function poll() {
  const gen = ++pollGen;
  while (gen === pollGen && code) {
    try {
      const r = await fetch(`/api/game?code=${encodeURIComponent(code)}&pid=${encodeURIComponent(me)}&v=${S ? S.v : 0}`, { cache: "no-store" });
      const j = await r.json();
      if (j.now) clockOffset = j.now - Date.now();
      if (gen !== pollGen) return;
      if (netDown) { netDown = false; render(); }
      if (j.gone) { flash("That table has closed."); return goHome(); }
      if (j.game) { S = j.game; render(); gotState(); }
    } catch (e) { if (!netDown) { netDown = true; render(); } }
    await sleep(document.hidden ? 5000 : 1200);
  }
}
async function pollLobbies() {
  while (view === "home") {
    try { const j = await (await fetch("/api/game?list=1", { cache: "no-store" })).json(); const next = j.lobbies || []; if (JSON.stringify(next) !== JSON.stringify(lobbies)) { lobbies = next; if (view === "home") renderHome(); } } catch (e) {}
    await sleep(4000);
  }
}
function gotState() { if (window.CutIn) { window.CutIn.reveal(S, nameOf, mySeat()); window.CutIn.observe(S, nameOf, mySeat()); } }
function enter(c) { code = c; poll(); }
function goHome() { pollGen++; code = null; S = null; view = "home"; ui = freshUI(); render(); pollLobbies(); }
function myName() {
  const el = document.getElementById("myname");
  const n = (el ? el.value : LS.get("wd-nick") || "").trim().slice(0, 20);
  if (!n) { flash("Type your name first."); el && el.focus(); return null; }
  LS.set("wd-nick", n); return n;
}
async function createGame() { const nick = myName(); if (!nick) return; code = null; const j = await call("create", { nick }); if (j && j.game) enter(j.game.code); }
async function joinGame(c) {
  c = (c || "").trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(c)) return flash("Enter the 4-letter game code.");
  const nick = myName(); if (!nick) return;
  code = c;
  const j = await call("join", { nick });
  if (!j) { code = null; return; }
  if (j.watching) flash("That game has already started. You're watching.");
  enter(c);
}

// ---------- helpers ----------
function nameOf(i) { const p = S && S.players && S.players[i]; return p ? (p.nick || `Player ${i + 1}`) : "Someone"; }
const fmt = m => esc(m).replace(/@(\d)/g, (_, i) => `<b>${esc(nameOf(+i))}</b>`);
const colName = c => E.COLORS[c].n;
const swatch = c => `<i class="sw" style="background:${E.COLORS[c].hex}"></i>`;
function flash(msg, good) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false; t.classList.toggle("good", !!good);
  clearTimeout(flash.h); flash.h = setTimeout(() => { t.hidden = true; }, 3200);
}
const mySeat = () => S && S.players ? S.players.findIndex(p => p.uid === me) : -1;

// ---------- rendering ----------
function render() {
  const seat = view === "game" && S && S.players ? mySeat() : -1;
  setHouse(seat >= 0 && S.status !== "lobby" ? HOUSE[S.players[seat].char] : "hogwarts");
  document.documentElement.dataset.screen = view === "home" || !S ? "home" : S.status === "lobby" ? "lobby" : "game";
  if (view === "home" || !S) return renderHome();
  if (S.status === "lobby") return renderLobby();
  renderGame();
}

// Jersey colours for each character, and scoreboard digits built from a 3x5 bulb grid.
// Each character belongs to a Hogwarts house; the house sets jersey stripes, shields and, for your own character, the whole screen.
const HOUSE = { harry: "gryffindor", hermione: "gryffindor", ron: "gryffindor", lupin: "gryffindor", hagrid: "gryffindor",
  draco: "slytherin", umbridge: "slytherin", luna: "ravenclaw", cho: "ravenclaw", myrtle: "ravenclaw", cedric: "hufflepuff", peeves: "hufflepuff" };
const HOUSES = {
  gryffindor: { n: "Gryffindor", trait: "Courage", c: "#c8282e", c2: "#eeba30", field: "#8b0f14", ink: "#eeba30" },
  slytherin: { n: "Slytherin", trait: "Ambition", c: "#2a9d5c", c2: "#c0c7cf", field: "#1a472a", ink: "#c0c7cf" },
  ravenclaw: { n: "Ravenclaw", trait: "Wit", c: "#3a64c8", c2: "#c48a4b", field: "#1d2f6f", ink: "#c48a4b" },
  hufflepuff: { n: "Hufflepuff", trait: "Loyalty", c: "#ecb939", c2: "#3b3226", field: "#ecb939", ink: "#2b2420" }
};
const THEME_META = { hogwarts: "#0b0916", gryffindor: "#130406", slytherin: "#030c09", ravenclaw: "#050a1a", hufflepuff: "#0a0905" };
const houseOf = ch => HOUSES[HOUSE[ch]] || HOUSES.gryffindor;
const kit = ch => `--c:${houseOf(ch).c};--c2:${houseOf(ch).c2}`;
const shield = ch => { const H = houseOf(ch); return `<svg class="shield" viewBox="0 0 40 46" aria-hidden="true"><path d="M3 3h34v17c0 11-8 18-17 23C11 38 3 31 3 20z" fill="${H.field}"/><path d="M3 12h34v5H3z" fill="${H.ink}"/><path d="M3 3h34v17c0 11-8 18-17 23C11 38 3 31 3 20z" fill="none" stroke="${H.ink}" stroke-width="2.4"/><text x="20" y="35" text-anchor="middle" fill="${H.ink}">${E.CHARS[ch].n[0]}</text></svg>`; };
function setHouse(house) {
  const root = document.documentElement;
  if (root.dataset.house === house) return;
  root.dataset.house = house;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = THEME_META[house] || THEME_META.hogwarts;
}
const DIGITS = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001", "111100111001111", "111100111101111", "111001001001001", "111101111101111", "111101111001111"];
const bulbs = (n, cls = "") => `<span class="bulbs ${cls}" role="img" aria-label="${n}">${[...DIGITS[Math.max(0, Math.min(9, n))]].map((b, i) => b === "1" ? `<i class="on" style="--i:${i}"></i>` : "<i></i>").join("")}</span>`;

function refHTML() {
  const spells = Object.entries(E.SPELLS).map(([k, s]) => `<li><b>${s.n}${k === "accio2" ? " (two-colour)" : k === "accioAny" ? " (any colour)" : ""}</b>: ${s.d}</li>`).join("");
  const chars = CHAR_KEYS.map(k => `<li><b>${E.CHARS[k].n}</b>: ${E.CHARS[k].d}</li>`).join("");
  const sets = E.COLOR_KEYS.map(c => `<li>${swatch(c)}<b>${colName(c)}</b>: ${E.COLORS[c].size} cards · charge ${E.COLORS[c].rent.join(" / ")}</li>`).join("");
  return `<details class="ref"><summary>How to play</summary><div class="cols">
    <div><h3>Your turn</h3><ul>
      <li>Draw 2 cards (5 if your hand is empty).</li>
      <li>Play up to 3 cards: bank Galleons or spells, lay items on the table, or cast spells.</li>
      <li>End with 7 or fewer cards in hand.</li>
      <li>When you owe points, pay from your bank or table, never your hand. No change is given.</li>
      <li><b>Win</b> with three complete sets of different colours.</li></ul>
      <h3 style="margin-top:1.25rem">Characters (dealt at random)</h3><ul>${chars}</ul></div>
    <div><h3>Spells</h3><ul>${spells}</ul></div>
    <div><h3>Item sets</h3><ul>${sets}</ul><p class="muted" style="font-size:.88rem;margin-top:.6rem">The charge is what each player pays when you cast Accio on that colour, by how many items you hold.</p></div>
  </div></details>`;
}

function renderHome() {
  const last = LS.get("wd-last");
  const typed = document.getElementById("myname");
  const nameVal = typed ? typed.value : (LS.get("wd-nick") || "");
  const codeVal = document.getElementById("joincode")?.value || "";
  const focus = document.activeElement && document.activeElement.id;
  $app.innerHTML = `
  <header class="mast"><div><h1>Wizard's<span>Deal</span></h1>
    <p>Collect magical items, cast spells on your friends, and be the first to finish three sets of different colours. 2 to 12 players, each on their own phone or computer, playing by the rules of Monopoly Deal: Harry Potter.</p>
    <div class="race" aria-label="First to three complete sets wins">${bulbs(3, "big")}<p>Complete sets to win</p></div></div>
    <div class="fanwrap" aria-hidden="true"><div class="fan">${FAN.map(id => cardHTML(id)).join("")}</div></div></header>
  <div class="home-grid">
    <section class="kit">
      <label class="field"><h2>Your name</h2>
        <input type="text" id="myname" maxlength="20" placeholder="e.g. Ginny" value="${esc(nameVal)}" autocomplete="nickname">
        <p>This is how the other players will see you at the table.</p></label>
      <div class="field"><h2>Sit down at a table</h2>
        <div class="row"><button class="btn primary" data-a="create">Create a new table</button>
        ${last ? `<button class="btn ghost" data-a="rejoin">Return to table <span class="code-chip">${esc(last)}</span></button>` : ""}</div>
        <div class="divider">or join with a code</div>
        <form id="joinForm" class="joinrow"><label class="lbl" for="joincode" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Game code</label><input type="text" id="joincode" maxlength="4" placeholder="ABCD" autocomplete="off" value="${esc(codeVal)}"><button class="btn">Join</button></form></div>
    </section>
    <section class="fixtures"><header><h2>Open tables</h2><span class="lbl">${lobbies.length ? lobbies.length + " waiting" : "Live"}</span></header>
      ${lobbies.length ? `<ul class="fixlist">${lobbies.map(g => `<li><span class="code">${esc(g.code)}</span><span class="host">${esc(g.host)}'s table<span class="seatcount">${g.count} of ${E.MAX_PLAYERS} seated</span></span><button class="btn small" data-a="joinCode" data-code="${esc(g.code)}">Join</button></li>`).join("")}</ul>`
        : `<p class="nofix">No open tables right now. Create one and share the code with your friends.</p>`}</section>
  </div>
  ${refHTML()}
  <p class="fine">Fan-made and unofficial; not affiliated with Hasbro or Warner Bros. Item names are stand-ins where the real card names weren't available.</p>`;
  if (focus === "myname" || focus === "joincode") { const el = document.getElementById(focus); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function renderLobby() {
  const myIdx = mySeat();
  const isHost = S.host === me;
  const nickEl = document.getElementById("nick");
  const typing = nickEl && document.activeElement === nickEl ? nickEl.value : null;
  const mine = S.players[myIdx];
  $app.innerHTML = `<div class="lobby">
    <div class="codeboard"><span class="lbl">Table code</span><span class="bigcode">${esc(S.code)}</span><button class="btn small" data-a="copy">Copy code</button></div>
    <p class="hint">Friends open this website on their own device, type their name, then join with this code.</p>
    <div><h2>Seated at the table · ${S.players.length}/${E.MAX_PLAYERS}</h2>
    <ul class="seats">${S.players.map((p, i) => `<li><span class="no">${i + 1}</span><b>${esc(nameOf(i))}</b><span class="tag">${p.uid === S.host ? "Table owner" : ""}${p.uid === me ? (p.uid === S.host ? " · you" : "You") : ""}</span></li>`).join("")}
      ${S.players.length < E.MAX_PLAYERS ? `<li class="open"><span class="no">${S.players.length + 1}</span><span>Waiting for players · ${E.MAX_PLAYERS - S.players.length} more can join · ${E.decksFor(S.players.length)} deck${E.decksFor(S.players.length) > 1 ? "s" : ""} in play</span></li>` : ""}</ul></div>
    ${mine ? `<label class="namefield"><span class="lbl">Your name at the table</span><input type="text" id="nick" maxlength="20" value="${esc(typing ?? mine.nick ?? "")}"></label>` : `<p class="muted">This table is full or has started.</p>`}
    <p class="muted">When everyone is seated, the table owner presses Start. Each player is then dealt a different character at random, with its own power: ${CHAR_KEYS.map(c => E.CHARS[c].n).join(", ")}.</p>

// Seats around the table: [plate x, plate y, played x, played y] in % of the table, for wide and narrow screens, by number of opponents.
// Seats around the round table: you at the bottom (90°), opponents spaced evenly round the circle.
// Returns [x, y] in % of the table box; plates sit on the rim, played cards lie further in on the cloth.
// The table's shape follows the player count: 2 a long table, 3 a triangle, 4 a square, 5 a pentagon.
// Worked out in a box 100 units wide and bh tall; seat 0 (you) has the bottom side, the rest follow clockwise.

    <path d="${cloth}" fill="url(#cloth${id})"/>
    <g clip-path="url(#cloth${id}c)"><rect width="100" height="${bh}" filter="url(#nap${id})" opacity=".2" style="mix-blend-mode:overlay"/>
      <path d="${cloth}" fill="none" stroke="rgba(0,0,0,.42)" stroke-width="5"/><path d="${cloth}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
      <g fill="none" stroke-width=".55" opacity=".5">${arc(-Q * 2, -Q, "#ae0001")}${arc(-Q, 0, "#ecb939")}${arc(0, Q, "#2a4fb0")}${arc(Q, Q * 2, "#2a7a4a")}</g>
      <rect class="glintbar" x="-100" width="100" height="${bh}" fill="url(#glint${id})"/></g>
    <path d="${cloth}" fill="none" stroke="rgba(0,0,0,.65)" stroke-width=".35"/></svg>`;
}
// Placement on the table: a plate just outside its side, played cards inside along that side, turned to follow it.
const pct = (bh, [x, y]) => [+x.toFixed(2), +(y / bh * 100).toFixed(2)];
const ZONE_IN = { 2: .74, 3: .84, 4: .68, 5: .66 }, ZONE_IN_N = { 2: .7, 3: .8, 4: .64, 5: .6 }, ZONE_W = { 2: .5, 3: .5, 4: .62, 5: .64 };
for (let n = 6; n <= 12; n++) { ZONE_IN[n] = .72; ZONE_IN_N[n] = .66; ZONE_W[n] = .8; }
// slide moves a spot along its side: positive toward the side's upper end, negative toward its lower end
function seatSpot(g, bh, s, out, lo, hi, slide = 0) { const u = s.up || [0, -1]; return pct(bh, [Math.min(hi, Math.max(lo, s.mid[0] + s.out[0] * out + u[0] * slide)), s.mid[1] + s.out[1] * out + u[1] * slide]); }
function zoneSpot(g, bh, s, f, slide = 0) { const u = s.up || [0, -1]; return pct(bh, [g.c[0] + (s.mid[0] - g.c[0]) * f + u[0] * slide, g.c[1] + (s.mid[1] - g.c[1]) * f + u[1] * slide]); }
// On phones a seat on a left or right side can't fit its plate beside the table, so the plate moves up toward that
// side's upper corner and its cards sit a little lower, keeping both readable.
const sideSeat = s => Math.abs(s.out[0]) > .6;
const seatPos = (wx, wy, nx, ny) => `--x:${wx}%;--y:${wy}%;--nx:${nx}%;--ny:${ny}%`;

// A player's name plate on the rim: shield, name, sets done in bulbs, cards in hand, Galleons banked, and the turn light.
function plateHTML(i, v, waiting, rise, pos) {
  const p = S.players[i], sets = E.completeCols(p).length;
  const live = S.status === "play" && S.turn === i && !S.pending, acting = S.status === "play" && S.pending && waiting.includes(i);
  return `<div class="plate${live ? " live" : ""}${acting ? " acting" : ""}${rise ? " rise" : ""}${i === v ? " mine" : ""}" style="${kit(p.char)};${pos}">
    ${shield(p.char)}<div class="pl"><b>${esc(i === v ? "You" : nameOf(i))}</b><small>${E.CHARS[p.char].n}${p.petrified != null ? ` · <span class="frozen">Frozen</span>` : ""}</small></div>
    <div class="pm"><span class="setpips" role="img" aria-label="${sets} of 3 sets complete">${[0, 1, 2].map(n => `<i${n < sets ? ` class="on" style="--i:${n}"` : ""}></i>`).join("")}</span><span class="hc" title="${p.hand.length} cards in hand"><i></i>${p.hand.length}</span><span class="bk" title="Bank: ${E.bankTotal(p)} points">${E.bankTotal(p)}</span></div>
    ${acting ? `<em class="resp">Responding · <span data-clock="resp">0:30</span></em>` : live ? `<em class="turnlight">On turn · <span data-clock="turn">3:00</span></em>` : ""}</div>`;
}
// The cards a player has played, laid on the cloth as small foil cards stacked by colour.
function miniHTML(e) {
  const c = E.card(e.c), hex = E.COLORS[e.col].hex;
  const face = c.type === "item" ? `linear-gradient(${hex},${hex})` : c.type === "wild" ? `linear-gradient(135deg,${E.COLORS[c.cols[0]].hex} 50%,${E.COLORS[c.cols[1]].hex} 50%)`
    : `conic-gradient(${E.COLOR_KEYS.map(k => E.COLORS[k].hex).join(",")},${E.COLORS.brown.hex})`;
  const ink = c.type === "item" && lum(hex) > .4 ? "#1d1606" : "#fff";
  return `<span class="mini" style="--mf:${face};color:${ink}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[c.type === "item" ? SET_ICON[e.col] : "star"]}</svg></span>`;
}
function playedHTML(p, pos, cls = "") {
  const stacks = E.COLOR_KEYS.filter(col => E.colCount(p, col)).map(col => {
    const C = E.COLORS[col], ents = p.table.filter(e => e.col === col), done = E.complete(p, col);
    const names = ents.map(e => { const c = E.card(e.c); return c.type === "item" ? c.name : "Wild"; }).join(", ");
    return `<div class="stack${done ? " done" : ""}" title="${esc(C.n)}: ${esc(names)}"><div class="minis">${ents.map(miniHTML).join("")}</div>
      <small>${Math.min(ents.length, C.size)}/${C.size}${done ? `<svg class="check" viewBox="0 0 16 16" aria-label="complete"><path d="M3 8.5l3.2 3L13 4.5"/></svg>` : ""}</small></div>`;
  }).join("");
  return `<div class="played${cls}" style="${pos}">${stacks || `<span class="nothing">No cards played yet</span>`}</div>`;
}

// The top bar: your house banner, the table code and the latest move.
function boardHTML(v, waiting) {
  const last = S.log.length ? S.log[S.log.length - 1] : "";
  const mine = v >= 0 ? S.players[v] : null, H = mine && houseOf(mine.char);
  return `<header class="board">
    ${H ? `<div class="houseband">${shield(mine.char)}<b>${H.n}</b><span>${E.CHARS[mine.char].n} · ${H.trait}</span></div>` : ""}
    <div class="board-top"><span class="mark">Wizard's Deal</span><span class="tcode"><span class="tl2">Table </span><b>${esc(S.code)}</b></span><span class="grow"></span>${netDown ? `<span class="conn">Reconnecting…</span>` : ""}<button class="btn ghost small sidebtn" data-a="side" aria-controls="side" aria-expanded="${sideOpen()}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON.geminio}</svg><span class="sbl">Players' cards</span></button><button class="btn ghost small" data-a="home">Leave table</button></div>
    ${last ? `<p class="ticker"><span class="tl">Latest</span><span>${fmt(last)}</span></p>` : ""}
  </header>`;
}

function renderGame() {
  const v = mySeat();
  const P = S.players[v];
  const n = S.players.length;
  const waiting = E.waitingOn(S);
  const myMove = v >= 0 && waiting.includes(v);
  document.title = myMove ? "Your move · Wizard's Deal" : "Wizard's Deal";
  const turnKey = S.status + ":" + S.turn + ":" + (S.pending ? "p" : "") + ":" + myMove;
  const flashNow = myMove && turnKey !== renderGame.lastKey && renderGame.lastKey !== undefined;
  renderGame.lastKey = turnKey;
  if (ui.seat !== v) { ui = freshUI(); ui.seat = v; }
  if (ui.sel != null && (!P || !P.hand.includes(ui.sel))) { ui.sel = null; ui.step = {}; }
  if (P) ui.picks = ui.picks.filter(id => P.hand.includes(id));
  if (ui.mode && (!P || S.turn !== v || S.pending || (ui.mode === "discard" && P.hand.length <= E.handLimit(P)) || (ui.mode === "unpetrify" && P.petrified == null))) { ui.mode = null; ui.picks = []; }
  const pk = S.pending ? `${S.pending.card}:${S.pending.caster}` : "";
  if (pk !== ui.payKey) { ui.payKey = pk; ui.pay = []; }

  // Opponents in clockwise order starting from the player after you.
  const base = v >= 0 ? v : 0;
  const order = Array.from({ length: n }, (_, k) => (base + k) % n).filter(i => i !== v);
  const max = E.maxPlays(S.players[S.turn], S);
  const topCard = S.discard.length ? S.discard[S.discard.length - 1] : null;
  const say = S.status === "over" ? `${esc(nameOf(S.winner))} wins!`
    : S.snitch ? `${esc(nameOf(S.snitch.p))} is about to win`
    : S.pending ? `${esc(nameOf(S.pending.caster))} cast ${spellLabel(S.pending)}`
    : S.turn === v ? (S.drew ? "Your turn" : "Your turn: draw") : `${esc(nameOf(S.turn))}'s turn`;
  const sub = S.status !== "play" ? "" : S.pending ? `Waiting on ${waiting.map(i => esc(i === v ? "you" : nameOf(i))).join(", ")}`
    : S.drew ? `${S.plays} of ${max} plays used` : S.turn === v ? "Draw your cards from the panel below" : "Drawing cards…";
  const blocked = S.pending && S.pending.tg.some(x => x.st === "counter");
  const now = S.players.map(p => E.completeCols(p).length), prev = renderGame.prevSets || [];
  renderGame.prevSets = now;
  const rose = i => prev.length === now.length && now[i] > prev[i];
  // Everyone round a table shaped to the player count: you take the bottom side, the rest follow clockwise.
  const seated = P ? [v, ...order] : order, nT = Math.max(2, Math.min(E.MAX_PLAYERS, seated.length));
  const BW = nT <= 2 ? 80 : 100, BN = 122, gw = tableGeom(nT, BW, false), gn = tableGeom(nT, BN, true);
  const spot = j => { const sw = gw.seats[j], sn = gn.seats[j];
    // phones: side seats of a square or pentagon lift their plate to the upper corner; a triangle's slanted seats slide down to the base corners
    const side = nT >= 4 && nT <= 5 && sideSeat(sn), slant = nT === 3 && j > 0;
    const pslide = side ? sn.len * .34 : slant ? -sn.len * .34 : 0, zslide = side ? -sn.len * .14 : slant ? sn.len * .14 : 0;
    return { plate: seatPos(...seatSpot(gw, BW, sw, nT <= 2 ? 6 : 7, 6, 94), ...seatSpot(gn, BN, sn, side ? 2 : slant ? 4 : 5, 14, 86, pslide)),
      zone: `${seatPos(...zoneSpot(gw, BW, sw, ZONE_IN[nT]), ...zoneSpot(gn, BN, sn, side ? .66 : slant ? .74 : ZONE_IN_N[nT], zslide))};--w:${(sw.len * ZONE_W[nT]).toFixed(1)}%;--nw:${(sn.len * (side ? .5 : ZONE_W[nT])).toFixed(1)}%;--rot:${sw.rot}deg;--nrot:${sn.rot}deg` }; };
  const [ccx, ccy] = pct(BW, gw.c), [ncx, ncy] = pct(BN, gn.c);

  $app.innerHTML = `
  ${boardHTML(v, waiting)}
  ${S.status === "over" ? winnerHTML(v) : ""}
  <div class="arena${sideOpen() ? " side-open" : ""}">
    <div class="table n${nT}${nT >= 6 ? " many" : ""}${flashNow ? " flash" : ""}" style="--cx:${ccx}%;--cy:${ccy}%;--ncx:${ncx}%;--ncy:${ncy}%;--cw:${nT === 3 ? 30 : 34}%;--ncw:${nT === 3 ? 42 : 48}%">
      ${tableSVG(gw, BW, "w", "wd")}${tableSVG(gn, BN, "n", "nw")}
      ${seated.map((i, j) => { const sp = spot(j); return plateHTML(i, v, waiting, rose(i), sp.plate) + playedHTML(S.players[i], sp.zone, i === v ? " mine" : ""); }).join("")}
      <div class="center">
      ${S.status === "play" && S.clock ? `<div class="tclock${S.pending ? " resp" : ""}"><span class="tlabel">${S.pending ? "Time to answer" : "Turn time"}</span><b data-clock="${S.pending ? "resp" : "turn"}">${S.pending ? "0:30" : "3:00"}</b><i class="tbar"><i data-clockbar="${S.pending ? "resp" : "turn"}"></i></i></div>` : ""}
      <div class="piles"><div class="pile"><div class="back" aria-label="${S.deck.length} cards in the draw pile"><span class="mono">W</span><span class="cnt">${S.deck.length}</span></div>Draw pile</div>
        <div class="pile">${topCard != null ? cardHTML(topCard, { cls: "small" }) : `<div class="slot"></div>`}Discard · ${S.discard.length}</div></div>
      <div class="say${myMove && !S.pending ? " mine" : ""}">${say}</div>
      ${blocked ? `<span class="stamp" style="color:var(--chalk);background:rgba(11,15,23,.4)">Protego</span>` : ""}
      ${S.status === "play" && !S.pending && S.drew ? `<div class="dots" aria-label="${S.plays} of ${max} plays used">${Array.from({ length: max }, (_, i) => `<i class="${i < S.plays ? "used" : ""}"></i>`).join("")}</div>` : ""}
      <div class="sub">${sub}</div>
    </div></div>
    ${P ? `<div class="zone">
      <section class="panel${myMove ? " live" : ""}" aria-live="polite">${panelHTML(v)}</section>
      <div class="handwrap"><div class="handhead"><h2>Your hand</h2><small>Only you can see it · ${P.hand.length} card${P.hand.length === 1 ? "" : "s"}</small></div>
        <div class="hand">${P.hand.map(id => cardHTML(id, { tag: "button", attrs: `data-a="sel" data-id="${id}"`, cls: (ui.sel === id ? "sel" : "") + (ui.picks.includes(id) ? " picked" : "") })).join("") || `<p class="empty">No cards in hand.</p>`}</div></div>
    </div>
    <section class="seat me${S.turn === v ? " turn" : ""}" style="${kit(P.char)}">
      <div class="housebar"><b>House ${houseOf(P.char).n}</b><span class="lbl">${houseOf(P.char).trait}</span></div>
      <div class="mychar">${whoHTML(v, true)}<div class="txt"><p class="power">${esc(E.CHARS[P.char].d)}</p>${charControls(v)}</div></div>
      <div class="mycols"><div><h3>Your table</h3>${tableHTML(P, true, S.status === "play" && S.turn === v && !S.pending)}</div>
      <div><h3>Your bank</h3><div class="bankrow">${bankHTML(P)}</div></div></div></section>` : `<p class="muted" style="grid-area:zone">You're watching this game.</p>`}
    <aside class="side" id="side" aria-label="Other players' cards"><div class="sidehead"><h2>Other players</h2><button class="btn ghost small" data-a="side">Hide</button></div><div class="sidelist">
    ${order.map(i => `<section class="seat${S.turn === i ? " turn" : ""}${waiting.includes(i) && S.pending ? " acting" : ""}" style="${kit(S.players[i].char)}">
      <div class="seathead">${whoHTML(i)}${statsHTML(S.players[i])}</div>
      ${tableHTML(S.players[i], false, false)}<div class="bankrow"><span class="lbl" style="margin-right:.35rem">Bank</span>${bankHTML(S.players[i])}</div></section>`).join("")}</div></aside>
    <div class="scrim" data-a="side" aria-hidden="true"></div>
  </div>
  <section class="log"><h2>Table talk</h2><ol>${S.log.slice(-25).map(m => `<li>${fmt(m)}${/blocked|Protego!/.test(m) ? `<span class="stamp">Blocked</span>` : /wins!$/.test(m) ? `<span class="stamp win">Full time</span>` : ""}</li>`).join("")}</ol></section>
  ${refHTML()}`;
}

function spellLabel(pd) { return (pd.k === "accio2" || pd.k === "accioAny") ? `Accio (${colName(pd.prm.col)})` : E.card(pd.card).name; }
function winnerHTML(v) {
  const sets = E.completeCols(S.players[S.winner]);
  return `<div class="winner${v === S.winner ? " you" : ""}"><span class="lbl">Full time</span><h2>${v === S.winner ? "You win!" : esc(nameOf(S.winner)) + " wins!"}</h2>
    <p class="muted">${sets.map(c => swatch(c) + colName(c)).join(", ")} sets completed.</p>
    <div class="row" style="justify-content:center">${S.host === me ? `<button class="btn primary" data-a="again">Play again with this table</button>` : `<span class="muted">The table owner can start a rematch.</span>`}<button class="btn ghost" data-a="home">Leave table</button></div></div>`;
}
function charControls(v) {
  const P = S.players[v];
  if (S.status !== "play" || S.turn !== v || S.pending) return "";
  let h = "";
  if (P.char === "harry" && P.petrified == null) h += `<label class="harrypick">Protect <select id="harrycol"><option value="">choose a colour</option>${E.COLOR_KEYS.map(c => `<option value="${c}"${P.harryCol === c ? " selected" : ""}>${colName(c)}</option>`).join("")}</select></label>`;
  if (P.petrified != null && ui.mode !== "unpetrify") h += `<div style="margin-top:.6rem"><button class="btn small" data-a="unpetMode">Break free (discard 10+ points)</button></div>`;
  return h;
}
const opt = (a, data, label, sub) => `<button class="opt" data-a="${a}" ${Object.entries(data).map(([k, x]) => `data-${k}="${esc(x)}"`).join(" ")}>${label}${sub ? `<small>${sub}</small>` : ""}</button>`;

function panelHTML(v) {
  const P = S.players[v];
  if (S.status !== "play") return `<h3>Game over</h3><p class="muted">Thanks for playing.</p>`;
  if (S.snitch) {
    const sn = S.snitch, card = E.card(sn.c), left = 2 - (S.players[sn.cho].snitches || 0);
    if (v === sn.cho) return `<p class="answerclock">Decide within <b data-clock="resp">0:30</b>, or the win stands</p><h3>Catch the Snitch?</h3>
      <p>${esc(nameOf(sn.p))} is about to win with ${esc(card.type === "item" ? card.name : "a wild item")}. You can send that card back to their hand. ${left} catch${left === 1 ? "" : "es"} left this game.</p>
      <div class="opts">${opt("snitch", { use: 1 }, "Catch the Snitch", "Their winning card goes back to their hand.")}${opt("snitch", { use: 0 }, "Let them win")}</div>`;
    return `<h3>Wait…</h3><p class="muted">${esc(nameOf(sn.p))} is about to win. ${esc(nameOf(sn.cho))} can catch the Snitch.</p>`;
  }
  const pd = S.pending;
  if (pd) {
    const t = pd.tg.find(x => x.p === v && x.st === "respond");
    if (t) return `<p class="answerclock">Answer within <b data-clock="resp">0:30</b>, or the game answers for you</p>` + respondHTML(v, pd, t);
    const blocked = v === pd.caster ? pd.tg.filter(x => x.st === "counter") : [];
    if (blocked.length) {
      const has = P.hand.some(id => E.card(id).k === "protego");
      return `<p class="answerclock">Decide within <b data-clock="resp">0:30</b></p><span class="stamp">Protego</span><h3>Blocked!</h3>${blocked.map(x => `<p>${esc(nameOf(x.p))} used Protego against your ${spellLabel(pd)}.</p><div class="opts">${has ? opt("counterP", { p: x.p }, "Cast Protego back", "Your spell goes through unless they block again.") : ""}${opt("yield", { p: x.p }, "Let it go")}</div>`).join("")}`;
    }
    return `<h3>Waiting…</h3><p class="muted">${E.waitingOn(S).map(i => esc(nameOf(i))).join(", ")} must respond to ${esc(nameOf(pd.caster))}'s ${spellLabel(pd)}.</p>`;
  }
  if (S.turn !== v) return `<h3>${esc(nameOf(S.turn))}'s turn</h3><p class="muted">Keep a Protego ready in case a spell comes your way.</p>`;
  if (S.peek && S.peek.p === v) {
    const want = Math.min(2, S.peek.cards.length);
    return `<h3>Keep ${want}</h3><p class="muted">Myrtle's ability: tap the ${want} cards you keep. The other goes back into the deck.</p>
      <div class="peek">${S.peek.cards.map(id => cardHTML(id, { tag: "button", attrs: `data-a="peekpick" data-id="${id}"`, cls: ui.keep.includes(id) ? "sel" : "" })).join("")}</div>
      <div class="row"><button class="btn primary" data-a="keep" ${ui.keep.length !== want ? "disabled" : ""}>Keep these</button></div>`;
  }
  if (!S.drew) {
    const n = P.hand.length === 0 ? 5 : E.has(P, "luna") ? 3 : 2;
    const holders = S.players.map((q, i) => i).filter(i => i !== v && S.players[i].hand.length);
    // Hagrid: copy someone's power before drawing
    let copy = "";
    if (E.active(P, "hagrid") && !P.copy) {
      const chars = [...new Set(S.players.filter((q, i) => i !== v).map(q => q.char))].filter(ch => ch !== "hagrid" && ch !== "cho");
      copy = `<p class="muted" style="font-size:.9rem">Hagrid's ability: copy a power for this turn first, if you like.</p><div class="opts">${chars.map(ch => E.copyReady(P, ch)
        ? opt("copy", { ch }, `Copy ${E.CHARS[ch].n}`, E.CHARS[ch].d)
        : `<button class="opt" disabled>${E.CHARS[ch].n}<small>Copied recently · ready in ${3 - ((P.turnNo || 0) - P.copied[ch]) + 1} turn${3 - ((P.turnNo || 0) - P.copied[ch]) + 1 === 1 ? "" : "s"}</small></button>`).join("")}</div>`;
    }
    const copied = P.copy ? `<p class="muted" style="font-size:.9rem">Copied for this turn: <b>${E.CHARS[P.copy].n}</b> · ${esc(E.CHARS[P.copy].d)}</p>` : "";
    let draws;
    if (E.has(P, "ron") && holders.length) draws = holders.map(p => opt("draw", { src: "ron", p }, `Draw ${n - 1} from the pile and 1 from ${esc(nameOf(p))}`, `Ron's ability · a random card from their ${S.players[p].hand.length}`)).join("");
    else draws = opt("draw", { src: "deck" }, "Draw from the pile");
    if (E.has(P, "cedric") && S.discard.length) draws += opt("draw", { src: "discard" }, "Draw from the discard pile", `Cedric's ability · top card: ${esc(E.card(S.discard[S.discard.length - 1]).name)}`);
    if (E.has(P, "myrtle")) draws += opt("draw", { src: "myrtle" }, "Look at 3, keep 2", "Myrtle's ability · the third goes back into the deck");
    if (E.has(P, "lupin")) draws += opt("draw", { src: "skip" }, "Skip drawing", "Lupin's ability · play up to 5 cards this turn");
    return `<h3>Draw ${n} cards</h3>${copy}${copied}<div class="opts">${draws}</div>`;
  }
  if (ui.mode === "discard") {
    const need = P.hand.length - E.handLimit(P);
    return `<h3>Discard ${need} card${need > 1 ? "s" : ""}</h3><p class="muted">You can keep ${E.handLimit(P)}. Tap cards in your hand to choose. ${ui.picks.length}/${need} chosen.</p><div class="row"><button class="btn primary" data-a="confirmDiscard" ${ui.picks.length !== need ? "disabled" : ""}>Discard and end turn</button><button class="btn ghost" data-a="cancelMode">Back</button></div>`;
  }
  if (ui.mode === "unpetrify") {
    const sum = ui.picks.reduce((s, id) => s + E.card(id).val, 0);
    return `<h3>Break free</h3><p class="muted">Tap hand cards worth 10 or more to discard. Selected: ${sum} points.</p><div class="row"><button class="btn primary" data-a="confirmUnpet" ${sum < 10 ? "disabled" : ""}>Discard and break free</button><button class="btn ghost" data-a="cancelMode">Back</button></div>`;
  }
  const max = E.maxPlays(P, S);
  const endBtn = `<button class="btn" data-a="end">End turn</button>`;
  const notes = (E.umbridgeLimits(P, S) ? `<p class="answerclock">Umbridge limits you to 2 plays while you have more complete sets than her.</p>` : "")
    + (P.copy ? `<p class="muted" style="font-size:.88rem">Copied for this turn: <b>${E.CHARS[P.copy].n}</b></p>` : "")
    + (E.has(P, "peeves") && !P.peeved && P.hand.length ? `<div class="opts">${S.players.map((q, i) => i).filter(i => i !== v && S.players[i].hand.length).map(p => opt("peeves", { p }, `Blind-swap with ${esc(nameOf(p))}`, "Peeves's ability · a random card each way, once per turn, free")).join("")}</div>` : "");
  if (S.plays >= max) return notes + `<h3>All ${max} plays used</h3><p class="muted">Move wild items if you like, then end your turn.</p><div class="row"><button class="btn primary" data-a="end">End turn</button></div>`;
  if (ui.sel == null) return notes + `<h3>Choose a card</h3><p class="muted">Tap a card in your hand to see what you can do with it. ${max - S.plays} play${max - S.plays === 1 ? "" : "s"} left.</p><div class="row">${endBtn}</div>`;
  return selectedHTML(v) + `<div class="row" style="margin-top:.2rem"><button class="btn ghost small" data-a="unsel">Cancel</button>${endBtn.replace('class="btn"', 'class="btn small"')}</div>`;
}

function respondHTML(v, pd, t) {
  const P = S.players[v];
  const has = P.hand.some(id => E.card(id).k === "protego");
  const caster = esc(nameOf(pd.caster));
  const prot = has ? opt("protego", {}, "Cast Protego", "Block this spell. The caster may answer with their own Protego.") : "";
  if (E.PAY_KINDS.includes(pd.k)) {
    const owned = E.payable(P);
    const guarded = P.table.filter(e => E.harryGuards(P, e.col));
    const sum = ui.pay.reduce((s, id) => s + E.card(id).val, 0);
    const allValuable = owned.filter(id => E.card(id).val > 0).every(id => ui.pay.includes(id));
    const ok = sum >= t.amt || allValuable;
    return `<h3>You owe ${t.amt}</h3><p>${caster} cast ${spellLabel(pd)}.</p>${prot ? `<div class="opts">${prot}</div>` : ""}
      ${owned.length ? `<p class="muted" style="font-size:.92rem">Choose what to pay with from your bank and table:</p><div class="paylist">${owned.map(id => { const c = E.card(id); const e = P.table.find(x => x.c === id);
        return `<button class="paybtn" data-a="payToggle" data-id="${id}" aria-pressed="${ui.pay.includes(id)}"><b>${c.val}</b>${esc(e ? (c.type === "item" ? c.name : "Wild (" + colName(e.col) + ")") : c.name)}</button>`; }).join("")}</div>`
        : `<p class="muted">You have nothing in your bank or on the table${guarded.length ? " that you can pay with" : ""}, so you pay nothing.</p>`}
      ${guarded.length ? `<p class="muted" style="font-size:.88rem"><span class="guard"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 2v4.2c0 3.2-2.3 5.6-5.5 6.8-3.2-1.2-5.5-3.6-5.5-6.8V3.5z"/></svg>Protected by Harry</span> Your ${colName(P.harryCol)} items are safe: you never have to pay with them.</p>` : ""}
      <div class="row"><button class="btn primary" data-a="pay" ${ok ? "" : "disabled"}>Pay ${sum}${sum < t.amt && ok ? " (all you have)" : ""}</button>${sum > t.amt ? `<span class="muted" style="font-size:.88rem">No change is given.</span>` : ""}</div>`;
  }
  const nm = id => { const c = E.card(id); return esc(c.type === "item" ? c.name : "a wild item"); };
  const what = pd.k === "levicorpus" ? `${caster} wants to take your ${nm(pd.prm.target)}.`
    : pd.k === "wingardium" ? `${caster} wants to send your ${nm(pd.prm.target)} to the discard pile.`
    : pd.k === "confundo" ? `${caster} wants to swap their ${nm(pd.prm.mine)} for your ${nm(pd.prm.target)}.`
    : pd.k === "obliviate" ? `${caster} wants to take your whole ${colName(pd.prm.col)} set.`
    : `${caster} wants to freeze your ${E.CHARS[P.char].n} ability.`;
  return `<h3>${E.card(pd.card).name}!</h3><p>${what}</p><div class="opts">${prot}${opt("accept", {}, "Accept")}</div>`;
}

function selectedHTML(v) {
  const P = S.players[v], id = ui.sel, c = E.card(id);
  const head = `<h3>${esc(c.name)}</h3>`;
  if (E.isItem(c)) return head + `<p class="muted">Play it onto your table${c.type === "item" ? "" : " as"}:</p><div class="opts">${E.colsFor(c).map(col => opt("place", { col }, `${swatch(col)}${colName(col)}`, `${E.colCount(P, col)}/${E.COLORS[col].size} in this set`)).join("")}</div>`;
  if (c.type === "point") return head + `<div class="opts">${opt("bank", {}, `Bank ${c.val} point${c.val > 1 ? "s" : ""}`)}</div>`;
  return head + `<p class="muted" style="font-size:.92rem">${E.SPELLS[c.k].d}</p><div class="opts">${castOptions(v, c)}${opt("bank", {}, `Bank it for ${c.val} point${c.val > 1 ? "s" : ""}`, "Banked spells can't be cast later.")}</div>`;
}

function castOptions(v, c) {
  const P = S.players[v];
  const others = S.players.map((_, i) => i).filter(i => i !== v);
  const none = msg => `<p class="muted" style="font-size:.9rem">${msg}</p>`;
  const st = ui.step;
  const itemName = e => { const k = E.card(e.c); return esc(k.type === "item" ? k.name : k.type === "any" ? "Any-colour wild" : "Wild item"); };
  switch (c.k) {
    case "protego": return none("Keep it in your hand. You'll be offered it when someone casts a spell at you.");
    case "geminio": return opt("cast", {}, "Cast Geminio", "Draw two more cards.");
    case "alohomora": return opt("cast", {}, "Cast Alohomora", "Every other player pays you 2.");
    case "accio2": { const cols = c.cols.filter(col => E.colCount(P, col));
      return cols.length ? cols.map(col => opt("cast", { col }, `${swatch(col)}Accio ${colName(col)}`, `Everyone pays you ${E.rent(P, col)}`)).join("") : none(`You need ${colName(c.cols[0])} or ${colName(c.cols[1])} items on your table to cast this.`); }
    case "accioAny": {
      const cols = E.COLOR_KEYS.filter(col => E.colCount(P, col));
      if (!cols.length) return none("You need items on your table to cast this.");
      return cols.map(col => opt("cast", { col }, `${swatch(col)}Accio ${colName(col)}`, `Everyone pays you ${E.rent(P, col)}`)).join("");
    }
    case "stupefy": return others.map(p => opt("cast", { p }, `Stupefy ${esc(nameOf(p))}`, "They pay you 5")).join("");
    case "petrificus": { const ok = others.filter(p => S.players[p].petrified == null);
      return ok.length ? ok.map(p => opt("cast", { p }, `Freeze ${esc(nameOf(p))}`, E.CHARS[S.players[p].char].n)).join("") : none("Every other character is already frozen."); }
    case "levicorpus": case "wingardium": {
      const list = [];
      others.forEach(p => S.players[p].table.forEach(e => { if (c.k === "levicorpus" ? E.canTake(S.players[p], e, P) : E.canBanish(S.players[p], e)) list.push(opt("cast", { p, target: e.c }, `${swatch(e.col)}${itemName(e)}`, `${esc(nameOf(p))} · ${colName(e.col)}`)); }));
      return list.join("") || none("No items can be targeted right now.");
    }
    case "confundo": {
      if (st.target == null) {
        const list = [];
        others.forEach(p => S.players[p].table.forEach(e => { if (E.canTake(S.players[p], e, P)) list.push(opt("step", { p, target: e.c }, `${swatch(e.col)}${itemName(e)}`, `Take from ${esc(nameOf(p))}`)); }));
        if (!P.table.some(e => !E.complete(P, e.col))) return none("You need an item outside a complete set to swap.");
        return list.length ? `<p class="muted" style="font-size:.9rem">First, the item you want:</p>` + list.join("") : none("No items can be taken right now.");
      }
      return `<p class="muted" style="font-size:.9rem">Now the item you give away:</p>` + P.table.filter(e => !E.complete(P, e.col)).map(e => opt("cast", { p: st.p, target: st.target, mine: e.c }, `${swatch(e.col)}${itemName(e)}`, colName(e.col))).join("");
    }
    case "obliviate": {
      const list = [];
      others.forEach(p => E.COLOR_KEYS.forEach(col => { if (E.canObliviate(S.players[p], col)) list.push(opt("cast", { p, col }, `${swatch(col)}${colName(col)} set`, `from ${esc(nameOf(p))}`)); }));
      return list.join("") || none("Nobody has a complete set you can take.");
    }
    case "reparo": {
      if (!S.discard.length) return none("The discard pile is empty.");
      if (st.pick == null) return `<p class="muted" style="font-size:.9rem">Pick a card from the discard pile:</p>` + [...S.discard].reverse().slice(0, 20).map(id => { const k = E.card(id);
        return E.isItem(k) ? opt("step", { pick: id }, esc(k.name), k.type === "item" ? colName(k.col) : "Wild item") : opt("cast", { pick: id }, esc(k.name), `${k.val} point${k.val === 1 ? "" : "s"} · goes to your bank`); }).join("");
      const k = E.card(st.pick);
      return `<p class="muted" style="font-size:.9rem">Place ${esc(k.name)} as:</p>` + E.colsFor(k).map(col => opt("cast", { pick: st.pick, col }, `${swatch(col)}${colName(col)}`)).join("");
    }
  }
  return "";
}

// ---------- events ----------
$app.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const d = b.dataset, num = k => d[k] != null && d[k] !== "" ? +d[k] : undefined;
  const v = S && S.players ? mySeat() : -1;
  switch (d.a) {
    case "create": return createGame();
    case "joinCode": return joinGame(d.code);
    case "rejoin": return joinGame(LS.get("wd-last"));
    case "home": return goHome();
    case "side": return setSide(!document.querySelector(".arena")?.classList.contains("side-open"));
    case "copy": try { await navigator.clipboard.writeText(S.code); flash("Code copied", true); } catch (err) { flash("Copy didn't work here. The code is " + S.code + "."); } return;
    case "leaveLobby": { await call("leave"); LS.del("wd-last"); return goHome(); }
    case "start": return call("start");
    case "again": return call("again");
    case "sel": {
      const id = num("id");
      if (ui.mode === "discard" && !ui.picks.includes(id) && ui.picks.length >= S.players[v].hand.length - E.handLimit(S.players[v])) return flash("That's enough cards. Tap a chosen card to put it back.");
      if (ui.mode === "discard" || ui.mode === "unpetrify") { ui.picks = ui.picks.includes(id) ? ui.picks.filter(x => x !== id) : [...ui.picks, id]; return render(); }
      if (S.turn !== v || !S.drew || S.pending) return flash(S.turn !== v ? "Wait for your turn to play cards." : S.pending ? "Wait for the spell to resolve." : "Draw your cards first.");
      ui.sel = ui.sel === id ? null : id; ui.step = {}; return render();
    }
    case "unsel": ui.sel = null; ui.step = {}; return render();
    case "step": if (d.col != null) ui.step.col = d.col; for (const k of ["p", "target", "pick"]) if (d[k] != null) ui.step[k] = num(k); return render();
    case "place": return act({ t: "place", card: ui.sel, col: d.col });
    case "bank": return act({ t: "bank", card: ui.sel });
    case "cast": return act({ t: "cast", card: ui.sel, col: d.col, p: num("p"), target: num("target"), mine: num("mine"), pick: num("pick") });
    case "draw": return act({ t: "draw", src: d.src, p: num("p") });
    case "peekpick": { const id = num("id"), want = Math.min(2, S.peek.cards.length); ui.keep = ui.keep.includes(id) ? ui.keep.filter(x => x !== id) : [...ui.keep, id].slice(-want); return render(); }
    case "keep": return act({ t: "keep", cards: ui.keep });
    case "copy": return act({ t: "copy", ch: d.ch });
    case "peeves": return act({ t: "peeves", p: num("p") });
    case "snitch": return act({ t: "snitch", use: d.use === "1" });
    case "end": {
      if (S.players[v].hand.length > E.handLimit(S.players[v])) { ui.mode = "discard"; ui.picks = []; ui.sel = null; return render(); }
      return act({ t: "end" });
    }
    case "confirmDiscard": return act({ t: "end", discard: ui.picks });
    case "unpetMode": ui.mode = "unpetrify"; ui.picks = []; ui.sel = null; return render();
    case "confirmUnpet": return act({ t: "unpetrify", cards: ui.picks });
    case "cancelMode": ui.mode = null; ui.picks = []; return render();
    case "recolor": {
      const P = S.players[v], id = num("id"), en = P.table.find(x => x.c === id);
      const cols = E.colsFor(E.card(id)); const next = cols[(cols.indexOf(en.col) + 1) % cols.length];
      return act({ t: "recolor", card: id, col: next });
    }
    case "payToggle": { const id = num("id"); ui.pay = ui.pay.includes(id) ? ui.pay.filter(x => x !== id) : [...ui.pay, id]; return render(); }
    case "pay": return act({ t: "respond", choice: "accept", pay: ui.pay });
    case "accept": return act({ t: "respond", choice: "accept" });
    case "protego": return act({ t: "respond", choice: "protego" });
    case "counterP": return act({ t: "counter", p: num("p"), choice: "protego" });
    case "yield": return act({ t: "counter", p: num("p"), choice: "yield" });
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector(".arena.side-open") && !matchMedia("(min-width:1000px)").matches) setSide(false); });
$app.addEventListener("submit", e => { if (e.target.id === "joinForm") { e.preventDefault(); joinGame(document.getElementById("joincode").value); } });
$app.addEventListener("change", e => {
  if (e.target.id === "myname") LS.set("wd-nick", e.target.value.trim().slice(0, 20));
  if (e.target.id === "harrycol" && e.target.value) return act({ t: "harry", col: e.target.value });
  if (e.target.id === "nick") { const nick = e.target.value.trim().slice(0, 20); LS.set("wd-nick", nick); call("nick", { nick }); }
});

// Collector's cards: hand cards and the home fan lean toward the pointer, and the foil sheen follows it.
const stillMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let tiltEl = null, tiltRaf = 0;
function untilt() { if (!tiltEl) return; tiltEl.classList.remove("tilting"); ["--rx", "--ry", "--mx", "--my"].forEach(p => tiltEl.style.removeProperty(p)); tiltEl = null; }
document.addEventListener("pointermove", e => {
  const el = e.target.closest ? e.target.closest("button.card, .fanwrap") : null;
  if (tiltEl && tiltEl !== el) untilt();
  if (!el || stillMotion()) return;
  const target = el.classList.contains("fanwrap") ? el.querySelector(".fan") : el;
  cancelAnimationFrame(tiltRaf);
  tiltRaf = requestAnimationFrame(() => {
    const r = el.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    tiltEl = target; target.classList.add("tilting");
    target.style.setProperty("--rx", ((.5 - y) * 18).toFixed(2) + "deg");
    target.style.setProperty("--ry", ((x - .5) * 22).toFixed(2) + "deg");
    target.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
    target.style.setProperty("--my", (y * 100).toFixed(1) + "%");
  });
}, { passive: true });
document.addEventListener("pointerout", e => { if (tiltEl && !(e.relatedTarget && tiltEl.contains(e.relatedTarget))) untilt(); });

// Countdowns: the turn clock and the answer clock, worked out from the server's timestamps.
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
setInterval(() => {
  const c = S && S.status === "play" && S.clock;
  if (!c || view !== "game") return;
  const now = Date.now() + clockOffset;
  const left = { turn: c.since != null ? c.left - (now - c.since) : c.left, resp: c.resp != null ? c.resp - now : E.RESPOND_MS };
  const full = { turn: E.TURN_MS, resp: E.RESPOND_MS }, lowAt = { turn: 30000, resp: 10000 };
  document.querySelectorAll("[data-clock]").forEach(el => {
    const k = el.dataset.clock; el.textContent = mmss(left[k]);
    (el.closest(".tclock") || el.closest("em") || el).classList.toggle("low", left[k] <= lowAt[k]);
  });
  document.querySelectorAll("[data-clockbar]").forEach(el => { const k = el.dataset.clockbar; el.style.setProperty("--p", Math.max(0, Math.min(1, left[k] / full[k])).toFixed(3)); });
}, 250);

// Start: go straight back to your table if you were seated at one.
(async () => {
  render();
  const last = LS.get("wd-last");
  if (last) {
    try {
      const j = await (await fetch(`/api/game?code=${last}&pid=${me}`, { cache: "no-store" })).json();
      if (j.now) clockOffset = j.now - Date.now();
      if (j.game && j.game.players.some(p => p.uid === me) && j.game.status !== "closed") { S = j.game; code = last; view = "game"; render(); gotState(); return poll(); }
    } catch (e) {}
  }
  pollLobbies();
})();
</script>
</body>
</html>
